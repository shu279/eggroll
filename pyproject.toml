[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egg-model-pytorch"
version = "0.1.0"
description = "A small, readable PyTorch reproduction of the pure-int8 EGG model and EGGROLL training"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "torch>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
egg-train = "egg.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
